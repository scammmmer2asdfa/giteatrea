[package]
name = "repolens"
version = "0.2.0"
description = "Explore any GitHub repository as an interactive map"
authors = ["RepoLens contributors"]
license = "MIT"
repository = "https://github.com/scammmmer2asdfa/giteatrea"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "repolens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
